[project]
name = "interlinear-book-maker"
version = "0.1.0"
description = "Interlinear German-English study edition pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "spacy>=3.8,<4",
    "httpx>=0.27",
    "fpdf2>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
interlinear-book-maker = "interlinear_book_maker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interlinear_book_maker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
